name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # El juego es un solo archivo sin <!doctype>/<html> (formato Artifact);
      # aquí se envuelve en un documento completo como index.html.
      - name: Preparar el sitio
        run: |
          mkdir -p _site
          {
            printf '<!doctype html>\n<html lang="es">\n'
            cat tesoro-de-los-numeros.html
            printf '\n</html>\n'
          } > _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tesoro de los Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Pirata+One&display=swap">
<style>
/* Layout: one centered column (max 560px). A parchment sea chart on a night-sea backdrop; each island opens a problem scroll with a wooden keypad. Single deliberate dark-sea look. */
:root{
  --sea-deep:#0b2d3a; --sea:#145063; --foam:#8fd0cf;
  --parchment:#f2deb0; --parchment-2:#e2c487; --ink:#3b2516; --ink-soft:#6e4c31;
  --gold:#eaad31; --gold-deep:#b57610; --coral:#c9472f; --palm:#4f8a3c; --wash:#c3dccb; --sand:#ecd394;
  --wood:#7b4a25; --wood-dark:#4e2d14; --ok:#2f7d43; --shade:rgba(10,20,25,.55);
  --font-display:"Pirata One", Georgia, "Times New Roman", serif;
  --font-body:"Andika", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  background-color:var(--sea-deep);
  background-image:radial-gradient(ellipse at 50% -10%, var(--sea) 0%, transparent 65%);
  background-attachment:fixed;
  color:var(--parchment); font-family:var(--font-body); font-size:18px; line-height:1.45;
}
.wrap{max-width:560px; margin:0 auto; padding-inline:16px; padding-block:18px 48px; display:flex; flex-direction:column; gap:16px}
button{font:inherit; cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold); outline-offset:3px}

/* Header */
.head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.brand h1{margin:0; font-family:var(--font-display); font-weight:400; font-size:2.4rem; line-height:1; color:var(--gold); letter-spacing:.01em; text-wrap:balance}
.brand p{margin:4px 0 0; color:var(--foam); font-size:.95rem}
.purse{display:flex; align-items:center; gap:10px}
.coinbox{display:flex; align-items:center; gap:8px; background:var(--wood-dark); border:2px solid var(--gold-deep); border-radius:999px; padding:4px 14px 4px 6px; font-weight:700; font-variant-numeric:tabular-nums}
.coinbox .coin{width:24px; height:24px}
.coinbox.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.iconbtn{width:42px; height:42px; border-radius:50%; border:2px solid var(--gold-deep); background:var(--wood-dark); color:var(--parchment); display:grid; place-items:center; padding:0}
.iconbtn svg{width:22px; height:22px}

/* Coins */
.coin{display:inline-block; width:18px; height:18px; border-radius:50%; flex:none;
  background:radial-gradient(circle at 35% 35%, #fff2b8 0 12%, var(--gold) 35%, var(--gold-deep) 100%);
  box-shadow:inset 0 0 0 2px var(--gold-deep)}

/* Map */
.chart{background:var(--parchment); color:var(--ink); border-radius:8px 16px 10px 14px; padding:10px;
  box-shadow:0 14px 34px rgba(0,0,0,.5), inset 0 0 50px rgba(140,90,30,.35)}
.chart svg{display:block; width:100%; height:auto}
.sea-wash{fill:var(--wash)}
.frame{fill:none; stroke:var(--ink-soft); stroke-width:1.5}
.wave{fill:none; stroke:var(--ink-soft); opacity:.4; stroke-width:1.6; stroke-linecap:round}
.route{fill:none; stroke:var(--coral); stroke-width:3.5; stroke-dasharray:1 10; stroke-linecap:round}
.shallow{fill:var(--foam); opacity:.55}
.sand{fill:var(--sand); stroke:var(--ink-soft); stroke-width:1.5}
.green{fill:var(--palm)}
.trunk{stroke:var(--wood); stroke-width:3; fill:none; stroke-linecap:round}
.leaf{fill:var(--palm); stroke:var(--ink-soft); stroke-width:.8}
.rock{fill:#cbbf9f; stroke:var(--ink-soft); stroke-width:1.5}
.eye{fill:var(--ink)}
.volc{fill:#9a7a55; stroke:var(--ink-soft); stroke-width:1.5}
.lava{fill:var(--coral)}
.isl-label{font-family:var(--font-display); font-size:20px; fill:var(--ink); text-anchor:middle}
.isl-sub{font-family:var(--font-body); font-size:12.5px; font-weight:700; fill:var(--ink-soft); text-anchor:middle}
.badge circle{fill:var(--gold); stroke:var(--ink); stroke-width:2}
.badge text{font:700 22px var(--font-body); fill:var(--ink); text-anchor:middle; dominant-baseline:central}
.flagpole{stroke:var(--ink); stroke-width:2}
.flagcloth{fill:var(--coral)}
.island{outline:none}
.island.locked{opacity:.45; filter:url(#gray)}
.island:not(.locked){cursor:pointer}
.island .ring{fill:none; stroke:var(--coral); stroke-width:3; stroke-dasharray:7 7; opacity:0; transform-box:fill-box; transform-origin:center}
.island.next .ring{opacity:1; animation:spin 14s linear infinite}
.island:focus-visible .sand{stroke:var(--coral); stroke-width:4}
.island:not(.locked):hover .sand{stroke-width:3}
@keyframes spin{to{transform:rotate(360deg)}}
.xmark{stroke:var(--coral); stroke-width:6; stroke-linecap:round}
.compass circle{fill:var(--parchment); stroke:var(--ink-soft); stroke-width:1.5}
.compass path{fill:var(--ink-soft)}
.compass path.n{fill:var(--coral)}
.compass text{font:700 11px var(--font-body); fill:var(--ink); text-anchor:middle}
.hull{fill:var(--wood); stroke:var(--wood-dark); stroke-width:1.5}
.mast{stroke:var(--wood-dark); stroke-width:2.5}
.sail{fill:#fbf3df; stroke:var(--ink-soft); stroke-width:1}
.jolly{fill:#1d1410}
#ship{transition:transform 1.6s cubic-bezier(.45,.05,.3,1)}
.ship-bob{animation:bob 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center bottom}
@keyframes bob{50%{transform:translateY(-3px) rotate(-3deg)}}

/* Progress strip under map */
.voyage{display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; background:rgba(0,0,0,.22); border:1px solid rgba(234,173,49,.35); border-radius:14px; padding:14px}
.voyage svg{width:104px; height:104px; display:block; border-radius:6px}
.voyage h2{margin:0 0 4px; font-family:var(--font-display); font-weight:400; font-size:1.5rem; color:var(--gold)}
.voyage p{margin:0; font-size:.95rem; color:var(--parchment)}
.mini-bg{fill:var(--parchment)}
.mini-route{fill:none; stroke:var(--coral); stroke-width:2.5; stroke-dasharray:1 5; stroke-linecap:round}
.mini-x{stroke:var(--coral); stroke-width:4; stroke-linecap:round}
.fog{fill:var(--sea); stroke:var(--sea-deep); stroke-width:2; transition:opacity .6s}
.fog-q{font:700 22px var(--font-display); fill:var(--foam); text-anchor:middle; dominant-baseline:central; transition:opacity .6s}
.reset{background:none; border:none; color:var(--foam); text-decoration:underline; padding:4px 0; font-size:.9rem; justify-self:start; margin-top:6px}

/* Island screen */
.topbar{display:flex; align-items:center; gap:12px}
.back{background:var(--wood-dark); color:var(--parchment); border:2px solid var(--gold-deep); border-radius:999px; padding:6px 14px; font-weight:700}
.topbar h2{margin:0; flex:1; min-width:0; font-family:var(--font-display); font-weight:400; font-size:1.8rem; color:var(--gold); line-height:1.05}
.lives{display:flex; gap:4px; flex:none}
.heart{width:28px; height:28px; display:block}
.heart path{fill:var(--coral); stroke:var(--parchment); stroke-width:1.5}
.heart.lost path{fill:none; stroke:var(--foam); opacity:.45}
.heart.breaking{animation:heartbreak .7s}
@keyframes heartbreak{0%{transform:scale(1)}30%{transform:scale(1.4) rotate(-12deg)}60%{transform:scale(.8) rotate(10deg)}100%{transform:scale(1)}}
.card .lives .heart{width:36px; height:36px}
.pips{display:flex; gap:8px; justify-content:center}
.pip{width:30px; height:30px; border-radius:50%; border:2px dashed var(--foam); opacity:.6; display:grid; place-items:center; font-size:.8rem; font-weight:700; color:var(--foam)}
.pip.now{opacity:1; border-style:solid; border-color:var(--gold); color:var(--gold)}
.pip.done{opacity:1; border:none; background:radial-gradient(circle at 35% 35%, #fff2b8 0 12%, var(--gold) 35%, var(--gold-deep) 100%); color:var(--ink)}
.pip.miss{opacity:1; border:2px solid var(--coral); color:var(--coral)}
.scroll{background:var(--parchment); color:var(--ink); border-radius:6px; padding:20px 20px 18px; position:relative;
  box-shadow:0 12px 28px rgba(0,0,0,.45), inset 0 0 40px rgba(140,90,30,.3);
  border-top:10px solid var(--parchment-2); border-bottom:10px solid var(--parchment-2)}
.qlabel{margin:0; font-size:.78rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft)}
.story{margin:6px 0 14px; font-size:1.28rem; line-height:1.5}
.equation{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:.35em; font-size:2.3rem; font-weight:700; font-variant-numeric:tabular-nums; padding-block:6px}
.equation .op{color:var(--coral)}
.blank{min-width:2.3em; min-height:1.35em; padding:0 .2em; border:3px dashed var(--ink-soft); border-radius:10px; display:inline-grid; place-items:center; background:rgba(255,255,255,.35); color:var(--ink)}
.blank.right{border-style:solid; border-color:var(--ok); color:var(--ok)}
.blank.wrong{border-style:solid; border-color:var(--coral); color:var(--coral); animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{min-height:1.6em; margin:6px 0 0; text-align:center; font-weight:700; font-size:1.1rem}
.feedback.good{color:var(--ok)}
.feedback.bad{color:var(--coral)}
.hint{margin-top:12px; border-top:2px dashed var(--parchment-2); padding-top:12px}
.hint p{margin:0 0 10px; font-size:1.05rem}
.hint p b{color:var(--coral)}
.dots{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center}
.grp{display:flex; flex-wrap:wrap; gap:4px; max-width:150px; padding:6px; border:2px solid var(--parchment-2); border-radius:10px}
.grp.g1 .coin{filter:hue-rotate(-35deg) saturate(1.3)}
.grp.g2 .coin{filter:grayscale(.85) brightness(1.15)}
.plus{font-weight:700; font-size:1.4rem; color:var(--coral)}
.coin.gone{position:relative; opacity:.45}
.coin.gone::after{content:""; position:absolute; inset:-2px; background:linear-gradient(45deg,transparent 44%,var(--coral) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--coral) 44% 56%,transparent 56%)}
.rows{display:flex; flex-direction:column; gap:5px; align-items:center}
.row{display:flex; gap:4px; padding:3px 6px; border-radius:8px; background:rgba(123,74,37,.12)}
.parrot-tip{display:flex; gap:10px; align-items:flex-start}

.controls{display:flex; flex-direction:column; gap:12px}
.helpbtn{align-self:center; background:none; border:2px solid var(--foam); color:var(--foam); border-radius:999px; padding:8px 18px; font-weight:700; display:flex; gap:8px; align-items:center}
.helpbtn[disabled]{opacity:.4; cursor:default}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.key{min-height:58px; border-radius:12px; border:none; font-size:1.7rem; font-weight:700; color:var(--parchment);
  background:linear-gradient(180deg, #8d5a2f, var(--wood)); box-shadow:0 5px 0 var(--wood-dark), inset 0 1px 0 rgba(255,255,255,.18);
  font-variant-numeric:tabular-nums; transition:transform .06s, box-shadow .06s}
.key:active{transform:translateY(4px); box-shadow:0 1px 0 var(--wood-dark)}
.key.go{background:linear-gradient(180deg, #f3c25a, var(--gold)); color:var(--ink); box-shadow:0 5px 0 var(--gold-deep); font-size:1.15rem}
.key.go:active{box-shadow:0 1px 0 var(--gold-deep)}
.key.del{font-size:1.2rem}
.nextbtn{min-height:62px; border-radius:12px; border:none; font-size:1.3rem; font-weight:700; color:var(--ink); background:linear-gradient(180deg, #f3c25a, var(--gold)); box-shadow:0 5px 0 var(--gold-deep)}

/* Modal + final */
.modal{position:fixed; inset:0; background:var(--shade); display:grid; place-items:center; padding:16px; z-index:10}
.card{background:var(--parchment); color:var(--ink); border-radius:10px; padding:24px 22px; max-width:420px; width:100%; text-align:center;
  box-shadow:0 20px 50px rgba(0,0,0,.6), inset 0 0 40px rgba(140,90,30,.3); display:flex; flex-direction:column; gap:12px; align-items:center;
  animation:pop .45s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.85); opacity:.3}}
.card h2{margin:0; font-family:var(--font-display); font-weight:400; font-size:2.2rem; color:var(--coral); line-height:1.05; text-wrap:balance}
.card p{margin:0; font-size:1.1rem}
.card .big{font-size:1.5rem; font-weight:700; display:flex; gap:8px; align-items:center; justify-content:center}
.card .big .coin{width:28px; height:28px}
.card button{min-height:54px; padding:0 26px; border-radius:12px; border:none; font-size:1.15rem; font-weight:700; color:var(--ink); background:linear-gradient(180deg, #f3c25a, var(--gold)); box-shadow:0 5px 0 var(--gold-deep)}
.card svg.piece{width:120px; height:120px; border-radius:6px}
.final{display:flex; flex-direction:column; gap:14px; align-items:center; text-align:center}
.final h2{margin:0; font-family:var(--font-display); font-weight:400; font-size:2.8rem; color:var(--gold); line-height:1; text-wrap:balance}
.final p{margin:0; max-width:34ch}
.rank{font-family:var(--font-display); font-size:1.9rem; color:var(--parchment)}
.chest{width:min(260px,80%); height:auto}
.chest .box{fill:var(--wood); stroke:var(--wood-dark); stroke-width:3}
.chest .band{fill:var(--gold); stroke:var(--gold-deep); stroke-width:2}
.chest .glow{fill:var(--gold); opacity:0; animation:glow 1s .9s forwards}
.chest .lid{transform-box:fill-box; transform-origin:8% 100%; animation:open 1.1s .4s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes open{to{transform:rotate(-28deg) translate(-6px,-14px)}}
@keyframes glow{to{opacity:.9}}
.final .tally{display:flex; gap:10px; align-items:center; font-size:1.6rem; font-weight:700}
.final .tally .coin{width:30px; height:30px}
.final button{min-height:56px; padding:0 28px; border-radius:12px; border:none; font-size:1.2rem; font-weight:700; color:var(--ink); background:linear-gradient(180deg, #f3c25a, var(--gold)); box-shadow:0 5px 0 var(--gold-deep)}
#rain{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:20}

@media (max-width:420px){
  .brand h1{font-size:2rem}
  .story{font-size:1.15rem}
  .equation{font-size:1.9rem}
  .topbar h2{font-size:1.35rem}
  .heart{width:24px; height:24px}
  .voyage{grid-template-columns:1fr; justify-items:center; text-align:center}
  .reset{justify-self:center}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important; transition:none!important}
  .chest .lid{transform:rotate(-28deg) translate(-6px,-14px)}
  .chest .glow{opacity:.9}
}
</style>

<div class="wrap">
  <header class="head">
    <div class="brand">
      <h1>Tesoro de los Números</h1>
      <p>Cuatro islas, veinte retos y un cofre escondido</p>
    </div>
    <div class="purse">
      <div class="coinbox" id="purse" aria-label="Doblones ganados"><span class="coin"></span><span id="purse-n">0</span></div>
      <button class="iconbtn" id="mute" aria-label="Silenciar sonido" title="Sonido">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="mute-wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="mute-x" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
      </button>
    </div>
  </header>

  <!-- MAP -->
  <section id="map-screen" class="controls">
    <div class="chart">
      <svg id="map" viewBox="0 0 400 520" role="group" aria-label="Mapa de las islas">
        <defs>
          <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
        </defs>
        <rect class="sea-wash" x="6" y="6" width="388" height="508" rx="6"/>
        <rect class="frame" x="12" y="12" width="376" height="496" rx="4"/>
        <g id="waves"></g>
        <path class="route" d="M100,440 C180,478 250,430 295,345 C320,290 170,305 105,240 C55,190 215,205 290,150 C340,112 215,30 130,62"/>
        <g class="compass" transform="translate(348,468)">
          <circle r="26"/>
          <path class="n" d="M0,-22 L5,0 L-5,0 Z"/>
          <path d="M0,22 L5,0 L-5,0 Z M22,0 L0,5 L0,-5 Z M-22,0 L0,5 L0,-5 Z" opacity=".55"/>
          <text y="-30">N</text>
        </g>
        <g id="islands"></g>
        <g id="ship"><g class="ship-bob">
          <path class="hull" d="M-24,2 L24,2 L16,16 L-16,16 Z"/>
          <line class="mast" x1="0" y1="2" x2="0" y2="-30"/>
          <path class="sail" d="M2,-26 Q20,-13 2,-1 Z"/>
          <path class="sail" d="M-2,-24 Q-19,-12 -2,0 Z"/>
          <path class="jolly" d="M0,-30 L-12,-34 L0,-38 Z"/>
        </g></g>
      </svg>
    </div>
    <div class="voyage">
      <svg id="mini" viewBox="0 0 120 120" aria-hidden="true"></svg>
      <div style="min-width:0; display:grid">
        <h2 id="voy-title">Trozos del mapa</h2>
        <p id="voy-text"></p>
        <button class="reset" id="reset" hidden>Empezar de nuevo</button>
      </div>
    </div>
  </section>

  <!-- ISLAND -->
  <section id="island-screen" class="controls" hidden>
    <div class="topbar">
      <button class="back" id="back">← Mapa</button>
      <h2 id="isl-name"></h2>
      <div class="lives" id="lives" role="img" aria-label="3 vidas"></div>
    </div>
    <div class="pips" id="pips" aria-label="Progreso de la isla"></div>
    <article class="scroll">
      <p class="qlabel" id="qlabel"></p>
      <p class="story" id="story"></p>
      <div class="equation" id="equation" aria-live="polite"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <div class="hint" id="hint" hidden></div>
    </article>
    <button class="helpbtn" id="helpbtn">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 20c-2-4-2-9 2-12 3-2 7-2 9 1 1 2 0 4-2 4h-2c1 3 0 6-2 7" fill="#4f8a3c"/><circle cx="14" cy="8" r="1.4" fill="#1d1410"/><path d="M17.5 9.5l3 1-3 1.5z" fill="#eaad31"/></svg>
      Ayuda del loro
    </button>
    <div class="keypad" id="keypad"></div>
    <button class="nextbtn" id="next" hidden>Siguiente reto →</button>
  </section>

  <!-- FINAL -->
  <section id="final-screen" class="final" hidden>
    <svg class="chest" viewBox="0 0 220 180" aria-hidden="true">
      <ellipse class="glow" cx="110" cy="78" rx="80" ry="22"/>
      <g>
        <circle class="band" cx="80" cy="82" r="9"/><circle class="band" cx="100" cy="76" r="9"/><circle class="band" cx="122" cy="78" r="9"/><circle class="band" cx="142" cy="84" r="9"/><circle class="band" cx="110" cy="88" r="9"/>
      </g>
      <rect class="box" x="30" y="86" width="160" height="80" rx="6"/>
      <rect class="band" x="30" y="100" width="160" height="10"/>
      <rect class="band" x="98" y="112" width="24" height="30" rx="3"/>
      <g class="lid">
        <path class="box" d="M30,88 L30,60 Q110,20 190,60 L190,88 Z"/>
        <path class="band" d="M30,76 Q110,38 190,76 L190,84 Q110,46 30,84 Z"/>
      </g>
    </svg>
    <h2>¡Encontraste el tesoro!</h2>
    <div class="tally"><span class="coin"></span><span id="final-n">0</span> de 40 doblones</div>
    <div class="rank" id="rank"></div>
    <p id="rank-text"></p>
    <button id="again">Nueva aventura</button>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <h2 id="m-title"></h2>
    <div class="big" id="m-coins"></div>
    <svg class="piece" id="m-piece" viewBox="0 0 120 120" aria-hidden="true"></svg>
    <p id="m-text"></p>
    <button id="m-btn"></button>
  </div>
</div>
<canvas id="rain" hidden></canvas>

<script>
(() => {
const $ = id => document.getElementById(id);
const r = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- Islands and problem generators ----------
   Each island has 5 levels (easy → hard). Each level has several stories;
   the game picks one not seen before and fresh random numbers every time. */
const V = (nums, ...texts) => texts.map(t => () => { const n = nums(); return { nums: n, text: t(...n) }; });
const divNums = (b0, b1, q0, q1) => () => { const b = r(b0, b1), q = r(q0, q1); return [b * q, b]; };
const ISLANDS = [
  { id:'suma', name:'Isla del Coco', op:'+', word:'suma', pos:[100,440], seed:1.3, deco:'palm',
    levels:[

function solve(op, n) {

    state.seen = state.seen.filter(k => !k.startsWith(pre));

}

function startIsland(i) {
  const isl = ISLANDS[i];
  state.island = i; state.q = 0; state.earned = 0; state.results = []; state.lives = LIVES;
  state.problems = isl.levels.map((_, lv) => makeProblem(isl, lv)); save();
  $('isl-name').textContent = `${isl.name} · ${isl.word[0].toUpperCase() + isl.word.slice(1)}`;
  show('island-screen'); loadProblem();
}
function loadProblem() {
  const p = state.problems[state.q];
  state.answer = ''; state.tries = 0; state.hinted = false; state.solved = false;
  $('qlabel').textContent = `Reto ${state.q + 1} de 5`;
  $('story').textContent = p.text;
  $('feedback').textContent = ''; $('feedback').className = 'feedback';
  $('hint').hidden = true; $('hint').innerHTML = '';
  $('helpbtn').disabled = false;
  $('next').hidden = true; $('keypad').hidden = false;
  renderEquation(); renderPips(); renderLives(); updatePurse(state.earned);
}
/* Lives: 3 per island; every wrong answer costs one */
const LIVES = 3;
const HEART = '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>';
const hearts = (left, breaking = -1) => Array.from({ length: LIVES }, (_, k) =>
  `<svg class="heart ${k >= left ? 'lost' : ''} ${k === breaking ? 'breaking' : ''}" viewBox="0 0 24 24" aria-hidden="true">${HEART}</svg>`).join('');
function renderLives(justLost = false) {
  $('lives').innerHTML = hearts(state.lives, justLost ? state.lives : -1);
  $('lives').setAttribute('aria-label', `${state.lives} ${state.lives === 1 ? 'vida' : 'vidas'}`);
}
function renderEquation(cls = '') {
  const p = state.problems[state.q];
  const parts = p.nums.map(n => `<span>${n}</span>`).join(`<span class="op">${p.op}</span>`);
  $('equation').innerHTML = `${parts}<span class="op">=</span><span class="blank ${cls}" id="blank">${state.answer || '?'}</span>`;
}
function renderPips() {
  $('pips').innerHTML = [0,1,2,3,4].map(k => {
    const res = state.results[k];
    const c = res == null ? (k === state.q ? 'now' : '') : res > 0 ? 'done' : 'miss';
    return `<span class="pip ${c}" aria-label="Reto ${k + 1}">${res == null ? k + 1 : res > 0 ? '' : '×'}</span>`;
  }).join('');
}
function buildKeypad() {
  const keys = ['1','2','3','4','5','6','7','8','9','del','0','go'];
  $('keypad').innerHTML = keys.map(k => k === 'del' ? `<button class="key del" data-k="del" aria-label="Borrar">⌫ Borrar</button>`
    : k === 'go' ? `<button class="key go" data-k="go">¡Fuego!<br>Comprobar</button>` : `<button class="key" data-k="${k}">${k}</button>`).join('');
}
$('keypad').addEventListener('click', e => { const b = e.target.closest('.key'); if (b) press(b.dataset.k); });

function press(k) {
  if (state.solved) return;
  if (k === 'go') return check();
  sfx.tap();
  if (k === 'del') state.answer = state.answer.slice(0, -1);
  else if (state.answer.length < 3) state.answer = (state.answer === '0' ? '' : state.answer) + k;
  renderEquation();
}
const PRAISE = ['¡Correcto!', '¡Arrr, muy bien!', '¡Justo en el blanco!', '¡Así se navega!', '¡Excelente puntería!'];
function check() {
  const p = state.problems[state.q], fb = $('feedback');
  if (state.answer === '') { fb.className = 'feedback bad'; fb.textContent = 'Escribe un número con los botones.'; return; }
  const v = +state.answer;
  if (v === p.answer) {
    const pts = state.tries === 0 && !state.hinted ? 2 : 1;
    state.earned += pts; state.results[state.q] = pts; state.solved = true;
    sfx.ok(); renderEquation('right'); bumpPurse(); updatePurse(state.earned);
    fb.className = 'feedback good'; fb.textContent = `${pick(PRAISE)} Ganas ${pts} ${pts === 1 ? 'doblón' : 'doblones'}.`;
    finishProblem();
    return;
  }
  state.tries++; state.lives--; sfx.bad(); renderEquation('wrong'); renderLives(true);
  fb.className = 'feedback bad';
  if (state.lives <= 0) { state.solved = true; setTimeout(gameOver, 700); fb.textContent = '¡Oh, no! Te quedaste sin vidas.'; return; }
  fb.textContent = (v < p.answer ? 'Tu número es pequeño, prueba con uno más grande.' : 'Tu número es grande, prueba con uno más pequeño.')
    + ` Te ${state.lives === 1 ? 'queda 1 vida' : `quedan ${state.lives} vidas`}.`;
  if (state.tries === 2) showHint();
  state.answer = '';
  setTimeout(() => { if (!state.solved) renderEquation(); }, 900);
}
function finishProblem() {
  renderPips();
  $('keypad').hidden = true; $('helpbtn').disabled = true;
  const last = state.q === 4;
  $('next').textContent = last ? 'Terminar la isla →' : 'Siguiente reto →';
  $('next').hidden = false; $('next').focus({ preventScroll: true });
}
$('next').addEventListener('click', () => {
  sfx.tap();
  if (state.q < 4) { state.q++; loadProblem(); } else islandComplete();
});
$('helpbtn').addEventListener('click', () => { sfx.tap(); showHint(); });
$('back').addEventListener('click', () => { sfx.tap(); show('map-screen'); renderMap(); });

/* ---------- Parrot hints ---------- */
const coins = (n, cls = '') => Array.from({ length: n }, () => `<span class="coin ${cls}"></span>`).join('');
function showHint(afterReveal = false) {
  const p = state.problems[state.q], [a, b] = p.nums, h = $('hint');
  if (!afterReveal) state.hinted = true;
  let txt = '', vis = '';
  if (p.op === '+') {
    if (p.answer <= 40) {
      txt = 'El loro dice: <b>junta todas las monedas</b> y cuéntalas una por una.';
      vis = `<div class="dots">${p.nums.map((n, i) => `<div class="grp g${i}">${coins(n)}</div>`).join('<span class="plus">+</span>')}</div>`;
    } else {
      const dt = Math.floor(a / 10) * 10 + Math.floor(b / 10) * 10, du = a % 10 + b % 10;
      txt = `El loro dice: <b>suma primero las decenas</b>: ${Math.floor(a / 10) * 10} + ${Math.floor(b / 10) * 10} = ${dt}. Después las unidades: ${a % 10} + ${b % 10} = ${du}. Ahora junta ${dt} + ${du}.`;
    }
  } else if (p.op === '−') {
    if (a <= 40) {
      txt = `El loro dice: hay ${a} monedas. <b>Tacha las ${b} que se van</b> y cuenta las que quedan.`;
      vis = `<div class="dots"><div class="grp" style="max-width:220px">${coins(a - b)}${coins(b, 'gone')}</div></div>`;
    } else {
      const bt = Math.floor(b / 10) * 10, bu = b % 10;
      txt = `El loro dice: <b>quita primero las decenas</b>: ${a} − ${bt} = ${a - bt}.` + (bu ? ` Después quita las unidades: ${a - bt} − ${bu}.` : '');
    }
  } else if (p.op === '×') {
    txt = `El loro dice: son <b>${a} filas de ${b}</b>. Puedes sumar ${Array(Math.min(a, 9)).fill(b).join(' + ')}.`;
    vis = `<div class="rows">${Array.from({ length: a }, () => `<div class="row">${coins(b)}</div>`).join('')}</div>`;
  } else {
    txt = `El loro dice: <b>¿qué número por ${b} da ${a}?</b> Cada fila tiene ${b} monedas: cuenta cuántas filas hay.`;
    vis = `<div class="rows">${Array.from({ length: a / b }, () => `<div class="row">${coins(b)}</div>`).join('')}</div>`;
  }
  h.innerHTML = `<p>${txt}</p>${vis}`; h.hidden = false;
  $('helpbtn').disabled = true;
}

/* ---------- Island complete ---------- */
function islandComplete() {
  const i = state.island, isl = ISLANDS[i];
  const prev = state.scores[isl.id];
  shipAt = nextIdx();
  state.scores[isl.id] = prev == null ? state.earned : Math.max(prev, state.earned);
  save(); sfx.win();
  const last = allDone();
  $('m-title').textContent = state.earned >= 8 ? '¡Isla conquistada!' : '¡Isla superada!';
  $('m-coins').innerHTML = `<span class="coin"></span> ${state.earned} de 10 doblones`;
  miniMap($('m-piece'), ISLANDS.map((_, k) => done(k)));
  $('m-text').textContent = last ? 'Tienes los cuatro trozos. ¡El mapa está completo y la X marca el tesoro!'
    : `Encontraste un trozo del mapa del tesoro. Ahora puedes navegar a la ${ISLANDS[Math.min(i + 1, 3)].name}.`;
  if (done(i) && prev != null && i < nextIdx() - 1) $('m-text').textContent = 'Volviste a jugar esta isla. Guardamos tu mejor resultado.';
  $('m-btn').textContent = last ? 'Ir por el tesoro' : 'Volver al mapa';
  modalMode = 'done'; $('m-piece').hidden = false;
  $('modal').hidden = false; $('m-btn').focus();
}
/* Out of lives: the island starts over from reto 1 with new problems */
let modalMode = 'done';
function gameOver() {
  if ($('island-screen').hidden) return;     // they already went back to the map
  const p = state.problems[state.q], isl = ISLANDS[state.island];
  sfx.over();
  $('m-title').textContent = '¡Te quedaste sin vidas!';
  $('m-coins').innerHTML = `<div class="lives">${hearts(0)}</div>`;
  $('m-piece').hidden = true;
  $('m-text').textContent = `La respuesta era ${p.answer}. Vuelve a empezar la ${isl.name} con retos nuevos y 3 vidas. ¡Tú puedes!`;
  $('m-btn').textContent = 'Empezar la isla otra vez';
  modalMode = 'over';
  $('modal').hidden = false; $('m-btn').focus();
}
$('m-btn').addEventListener('click', () => {
  $('modal').hidden = true; sfx.tap();
  if (modalMode === 'over') return startIsland(state.island);
  show('map-screen'); renderMap();
});

/* ---------- Final ---------- */
function showFinal() {
  const t = total();
  $('final-n').textContent = t;
  const [rank, msg] = t >= 36 ? ['Leyenda de los siete mares', 'Resolviste casi todo a la primera. Ningún pirata cuenta mejor que tú.']
    : t >= 28 ? ['Navegante experto', 'Sumas, restas, multiplicas y divides como un pirata de verdad.']
    : t >= 18 ? ['Pirata valiente', 'Llegaste al tesoro. Juega otra vez para ganar más doblones.']
    : ['Grumete en entrenamiento', 'El tesoro es tuyo. Practica un poco más y subirás de rango.'];
  $('rank').textContent = rank; $('rank-text').textContent = msg;
  show('final-screen');
  // restart the chest animation
  const chest = document.querySelector('.chest'), clone = chest.cloneNode(true); chest.replaceWith(clone);
  sfx.win(); coinRain();
}
$('again').addEventListener('click', () => { state.scores = {}; usedCombos.clear(); save(); shipAt = null; sfx.tap(); show('map-screen'); renderMap(); });

function coinRain() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('rain'), ctx = c.getContext('2d'); c.hidden = false;
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const drops = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: -Math.random() * H, v: 2 + Math.random() * 4, r: 7 + Math.random() * 7, s: Math.random() * 6 }));
  const t0 = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    drops.forEach(d => {
      d.y += d.v; d.s += .08;
      const w = Math.abs(Math.cos(d.s)) * d.r + 1;
      ctx.fillStyle = '#b57610'; ctx.beginPath(); ctx.ellipse(d.x, d.y, w, d.r, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#eaad31'; ctx.beginPath(); ctx.ellipse(d.x, d.y, Math.max(w - 2, .5), d.r - 2, 0, 0, Math.PI * 2); ctx.fill();
    });
    if (t - t0 < 4200) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })(t0);
}

/* ---------- Keyboard ---------- */
document.addEventListener('keydown', e => {
  if ($('island-screen').hidden || !$('modal').hidden) return;
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === 'Backspace') { e.preventDefault(); press('del'); }
  else if (e.key === 'Enter' && !state.solved && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); check(); }
});

/* ---------- Boot ---------- */
function start(data) {
  load();
  if (data && data.scores) state.scores = data.scores;
  if (data && data.seen) state.seen = cleanSeen(data.seen);
  buildKeypad(); drawWaves(); renderMap();
}
try { window.claude?.hot?.snapshot?.(() => ({ scores: state.scores, seen: state.seen })); } catch (e) {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
